<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Corner Office</title>
<meta name="description" content="Corner Office - a business simulation by Pedro. Pick a business and grow it.">
<meta name="claude:viewport-fit-sides" content="cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky ticker bar; the org chart is the hero (left), the control desk sits right; ledger, milestones and log below. Memo-yellow marks anything that needs a decision. */
:root{
  --paper:#F3F5FA; --surface:#FFFFFF; --sunk:#E9EDF5; --ink:#14203A; --muted:#5A6680; --line:#D7DDEA;
  --accent:#2445D6; --accent-soft:#E3E9FF; --on-accent:#FFFFFF;
  --memo:#FFD84A; --memo-ink:#2B2200;
  --good:#16804F; --bad:#C23A3A; --warn:#B4741A;
  --f-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D1220; --surface:#151C2F; --sunk:#10172A; --ink:#E6EBF7; --muted:#95A1BC; --line:#27304A;
  --accent:#8199FF; --accent-soft:#1D2750; --on-accent:#0D1220;
  --good:#3BC487; --bad:#FF7B7B; --warn:#F0B24A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0D1220; --surface:#151C2F; --sunk:#10172A; --ink:#E6EBF7; --muted:#95A1BC; --line:#27304A;
  --accent:#8199FF; --accent-soft:#1D2750; --on-accent:#0D1220;
  --good:#3BC487; --bad:#FF7B7B; --warn:#F0B24A; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:17px;font-weight:700}
h3{font-size:15px;font-weight:700}
.eyebrow,.lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover:not(:disabled){color:var(--on-accent);filter:brightness(1.08)}
.btn.memo{background:var(--memo);border-color:var(--memo);color:var(--memo-ink);font-weight:600}
.btn.memo:hover:not(:disabled){color:var(--memo-ink);filter:brightness(1.04)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.danger{color:var(--bad)}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding-block:10px}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand b{font-family:var(--f-display);font-size:20px;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{color:var(--muted);font-size:12px}
.tick{display:flex;flex-direction:column}
.tick b{font-family:var(--f-display);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.run{font-size:14px;padding:9px 16px}
@media (max-width:640px){.top .wrap{gap:8px 16px}.brand{flex-basis:100%}.tick b{font-size:16px}.run{margin-left:auto}}

/* ---------- layout ---------- */
main.wrap{padding-block:18px 56px;display:flex;flex-direction:column;gap:18px}
.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1000px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel>header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}

/* ---------- memo (events) ---------- */
.memo-card{background:var(--memo);color:var(--memo-ink);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.memo-card .lbl{color:var(--memo-ink);opacity:.7}
.memo-card h2{font-size:22px}
.memo-card p{margin:0;max-width:70ch}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{background:rgba(255,255,255,.55);border:1px solid rgba(43,34,0,.25);border-radius:8px;padding:9px 12px;text-align:left;color:var(--memo-ink);display:flex;flex-direction:column;gap:2px;max-width:340px}
.opt b{font-weight:600}
.opt small{font-size:12px;opacity:.85}
.opt:hover{background:rgba(255,255,255,.85)}
.opt:focus-visible{outline-color:var(--memo-ink)}

/* ---------- org chart ---------- */
.org{display:flex;flex-direction:column;align-items:center;gap:0}
.node{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface);display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.ceo{background:var(--ink);color:var(--paper);border-color:var(--ink);align-items:center;padding:8px 22px}
.ceo .lbl{color:var(--paper);opacity:.7}
.ceo b{font-family:var(--f-display);font-size:16px}
.stem{width:2px;height:16px;background:var(--line)}
.execs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:560px}
.slot{border:1px dashed var(--line);border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:4px;min-width:0;background:var(--surface)}
.slot.filled{border-style:solid;background:var(--accent-soft);border-color:transparent}
.slot .who{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .what{font-size:12px;color:var(--muted);line-height:1.35}
.slot .act{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px}
.hint{font-size:11.5px;color:var(--muted)}
.depts{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%;padding-top:16px}
.depts::before{content:"";position:absolute;top:0;left:12.5%;right:12.5%;height:2px;background:var(--line)}
.dept{position:relative;border:1px solid var(--line);border-radius:var(--r);padding:11px;display:flex;flex-direction:column;gap:9px;min-width:0;background:var(--surface)}
.dept::before{content:"";position:absolute;top:-17px;left:50%;width:2px;height:16px;background:var(--line)}
@media (max-width:1180px) and (min-width:1001px),(max-width:760px){.depts{grid-template-columns:repeat(2,minmax(0,1fr))}.depts::before,.dept::before{display:none}}
@media (max-width:440px){.depts{grid-template-columns:minmax(0,1fr)}.execs{grid-template-columns:minmax(0,1fr)}}
.dept h3{display:flex;flex-direction:column;gap:1px}
.dept .out{font-family:var(--f-mono);font-size:11.5px;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:4px;min-height:20px}
.chip{background:var(--sunk);border-radius:99px;padding:1px 8px;font-size:11.5px;white-space:nowrap}
.dots{display:flex;flex-wrap:wrap;gap:3px;min-height:9px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ink)}
.dot.c{background:var(--muted);opacity:.6}
.dot.l{background:transparent;border:2px solid var(--warn)}
.more{font-size:11px;color:var(--muted);line-height:9px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rl{display:flex;flex-direction:column;font-size:12.5px;font-weight:500;min-width:0}
.rl small{font-weight:400;color:var(--muted);font-size:11px}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:none}
.step button{border:0;background:transparent;padding:3px 8px;font-size:14px;line-height:1.2}
.step button:hover:not(:disabled){background:var(--accent-soft);color:var(--accent)}
.step button:disabled{opacity:.35;cursor:not-allowed}
.step output{min-width:26px;text-align:center;font-family:var(--f-mono);font-size:12.5px;border-inline:1px solid var(--line);padding:3px 4px}
.step .x5{font-size:11px;font-family:var(--f-mono)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;vertical-align:middle;margin-right:5px}

/* ---------- levers ---------- */
.lever{display:grid;gap:4px;padding-block:8px;border-bottom:1px solid var(--line)}
.lever:last-of-type{border-bottom:0}
.lever .row b{font-family:var(--f-display);font-size:17px;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.proj{background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:12.5px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.proj div{display:flex;flex-direction:column;min-width:0}
.proj b{font-family:var(--f-mono);font-size:13px;font-weight:500}

/* ---------- advice / voices ---------- */
.advice{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.advice li{display:grid;grid-template-columns:8px minmax(0,1fr);gap:10px;align-items:start;font-size:13px}
.advice li::before{content:"";width:8px;height:8px;border-radius:2px;margin-top:6px;background:var(--accent)}
.advice li.w::before{background:var(--warn)}
.advice li.b::before{background:var(--bad)}
.voices{display:grid;gap:8px;margin-top:12px}
.voice{border-left:3px solid var(--line);padding:2px 0 2px 10px;font-size:13px}
.voice span{display:block;color:var(--muted);font-size:11.5px}

/* ---------- stats & ledger ---------- */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{display:flex;flex-direction:column;min-width:0}
.kpi b{font-family:var(--f-display);font-size:19px;font-variant-numeric:tabular-nums}
.meter{height:5px;border-radius:9px;background:var(--sunk);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--accent)}
.ledger{width:100%;border-collapse:collapse;font-size:13px}
.ledger td{padding:4px 0;border-bottom:1px dashed var(--line)}
.ledger td:last-child{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ledger tr.tot td{border-bottom:0;border-top:2px solid var(--ink);font-weight:600;padding-top:6px}
.actions{display:grid;gap:8px;margin-top:14px}
.actions .row{padding-block:6px;border-top:1px solid var(--line)}
.actions .rl{font-size:13px}

/* ---------- lower ---------- */
.lower{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1000px){.lower{grid-template-columns:minmax(0,1fr)}}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .rev{stroke:var(--accent);fill:none;stroke-width:2.2}
.chart .exp{stroke:var(--bad);fill:none;stroke-width:1.6;stroke-dasharray:4 3}
.chart .area{fill:var(--accent);opacity:.1}
.chart .end{fill:var(--accent)}
.ms{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ms li{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.ms li i{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;font-style:normal;font-size:11px}
.ms li.done{color:var(--ink)}
.ms li.done i{background:var(--good);border-color:var(--good);color:var(--surface)}
.log{list-style:none;margin:0;padding:0;display:grid;gap:5px;max-height:320px;overflow:auto;font-size:12.5px}
.log li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px}
.log li span{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding-top:1px}
.log li.good b{color:var(--good);font-weight:500}
.log li.bad b{color:var(--bad);font-weight:500}
.log li b{font-weight:400}
details.how summary{cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:15px}
details.how ul{margin:10px 0 0;padding-left:18px;display:grid;gap:4px;max-width:80ch}

/* ---------- setup ---------- */
.setup{padding-block:40px 64px;display:grid;gap:28px}
.hero h1{font-size:clamp(44px,8vw,88px);font-weight:800;line-height:.95;letter-spacing:-.03em}
.hero h1 em{font-style:normal;background:var(--memo);color:var(--memo-ink);padding:0 .12em;border-radius:6px}
.hero p{font-size:17px;max-width:56ch;color:var(--muted);margin:14px 0 0}
.field{display:grid;gap:6px;max-width:420px}
.field input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%}
.inds{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;border:0;padding:0;margin:0}
.inds legend{margin-bottom:8px;padding:0}
.ind{position:relative;display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface);cursor:pointer}
.ind input{position:absolute;opacity:0;pointer-events:none}
.ind b{font-family:var(--f-display);font-size:16px}
.ind span{font-size:12.5px;color:var(--muted)}
.ind .p{font-family:var(--f-mono);font-size:11.5px;color:var(--accent)}
.ind:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.ind:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.custom{display:flex;flex-wrap:wrap;gap:12px}
.custom .field{flex:1 1 220px}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:0;padding:0;list-style:none}
.rules li{border-top:2px solid var(--ink);padding-top:8px;font-size:13px}
.rules li b{display:block;font-family:var(--f-display);font-size:15px}
.end-card{background:var(--ink);color:var(--paper);border-radius:var(--r);padding:20px;display:grid;gap:10px}
.end-card h2{font-size:26px}
.end-card .lbl{color:var(--paper);opacity:.7}
.end-card p{margin:0;max-width:70ch}
.confirm{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.memo-card{animation:drop .35s ease-out}@keyframes drop{from{transform:translateY(-6px)}to{transform:none}}}

/* ---------- hiring desk & payroll ---------- */
.hr{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1000px){.hr{grid-template-columns:minmax(0,1fr)}}
.post{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.post select{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);max-width:100%}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cand{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:7px;min-width:0;background:var(--surface)}
.cand header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cand header div{display:flex;flex-direction:column;min-width:0}
.cand header b{font-family:var(--f-display);font-size:15px}
.cand p{margin:0;font-size:12.5px}
.verdict{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px;white-space:nowrap;border:1px solid currentColor}
.v-strong{color:var(--good)} .v-solid{color:var(--accent)} .v-gamble{color:var(--warn)} .v-pass{color:var(--bad)}
.stars{font-size:13px;letter-spacing:1px;color:var(--warn)}
.stars.pull{color:var(--accent)}
.scores{display:grid;gap:2px}
.srcs{display:grid;gap:7px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.src{display:grid;grid-template-columns:minmax(0,1fr) auto;font-size:12.5px;gap:2px 8px}
.src b{font-family:var(--f-mono);font-weight:500}
.src i{grid-column:1 / -1;height:4px;border-radius:4px;background:var(--accent);opacity:.75}
.stars span{letter-spacing:0;color:var(--muted);font-size:11.5px;margin-left:4px}
.traits{display:flex;flex-wrap:wrap;gap:4px}
.tr{font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--sunk)}
.tr.g{color:var(--good)} .tr.r{color:var(--bad)}
.why{color:var(--muted);font-style:italic}
.terms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:var(--sunk);border-radius:8px;padding:7px 9px;font-size:12px}
.terms div{display:flex;flex-direction:column;min-width:0}
.terms b{font-family:var(--f-mono);font-size:12px;font-weight:500}
.offer{display:flex;flex-wrap:wrap;gap:6px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:18px;color:var(--muted);font-size:13px}
.pay{display:grid;gap:2px}
.payrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding-block:7px;border-bottom:1px solid var(--line)}
.payrow:last-child{border-bottom:0}
.payrow .rl b{font-weight:500}
.payrow output{font-family:var(--f-display);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;text-align:right}
.payrow input{grid-column:1 / -1}
.payrow .meta{grid-column:1 / -1;display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted)}
.pill{font-family:var(--f-mono);font-size:10.5px;padding:0 6px;border-radius:99px;border:1px solid currentColor}
.talent{font-family:var(--f-mono);font-size:11px;color:var(--muted)}

/* ---------- live floor ---------- */
.floor-panel .fh{display:flex;flex-direction:column}
.fctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.floor-scroll{overflow-x:auto;border-radius:8px;border:1px solid var(--line)}
canvas.floor{display:block;width:100%;min-width:720px;aspect-ratio:1000/430;height:auto;background:var(--paper)}

/* ---------- tutorial ---------- */
.tut-hl{position:fixed;z-index:50;border:3px solid var(--memo);border-radius:12px;box-shadow:0 0 0 9999px rgba(8,12,28,.55);pointer-events:none;transition:left .25s ease,top .25s ease,width .25s ease,height .25s ease}
.tut-card{position:fixed;z-index:51;background:var(--memo);color:var(--memo-ink);border-radius:12px;padding:14px 16px;display:grid;gap:8px;box-shadow:0 12px 32px rgba(0,0,0,.3)}
.tut-card .lbl{color:var(--memo-ink);opacity:.7}
.tut-card h3{font-size:18px}
.tut-card p{margin:0;font-size:13.5px;line-height:1.5}
.tut-btns{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tut-nav{display:flex;gap:6px}
.tut-card .btn{background:rgba(255,255,255,.6);border-color:rgba(43,34,0,.3);color:var(--memo-ink)}
.tut-card .btn:hover:not(:disabled){color:var(--memo-ink);border-color:var(--memo-ink)}
.tut-card .btn.memo{background:var(--memo-ink);border-color:var(--memo-ink);color:var(--memo)}

<script>
(()=>{
const D=['sales','ops','product','support'];
const DN={sales:'Sales',ops:'Operations',product:'Product',support:'Support'};
const SAL={sales:4500,ops:3800,product:7000,support:3500};
const MGR=8000, VPS=15000, EXS={coo:24000,cfo:20000}, RENT=400, SPAN=6, CEO_SPAN=8, SERVE=450, SUP=800;
const MKT={sales:SAL.sales,ops:SAL.ops,product:SAL.product,support:SAL.support,mgr:MGR,vp:VPS,coo:EXS.coo,cfo:EXS.cfo};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const REGIONS=['Home city','Neighboring city','Statewide','Regional','Nationwide','Cross-border','Continental','Global'];
const SEASON={coffee:{0:1.15,1:1.1,10:1.1,11:1.2},tacos:{5:1.2,6:1.3,7:1.3},toys:{10:1.4,11:2},oil:{5:1.15,6:1.2,7:1.15},restaurant:{1:1.15,4:1.1,11:1.25},clothing:{2:1.1,8:1.15,10:1.2,11:1.3}};
const FIRST=['Ana','Ben','Chidi','Dana','Elif','Farah','Gus','Hana','Ivan','Jo','Kenji','Lena','Mateo','Nia','Omar','Priya','Quinn','Rosa','Sam','Tariq','Uma','Vik','Wen','Yara','Zoe','Bruno','Inês','Kofi','Lior','Mei'];
const LAST=['Okafor','Silva','Novak','Haddad','Kim','Moreau','Patel','Reyes','Lindqvist','Tanaka','Mensah','Costa','Weber','Ali','Rossi','Nakamura','Byrne','Duarte','Ivanova','Chen','Adeyemi','Larsen','Romero','Shah'];
const PLACES=['a family business','a fast-growing startup','a national chain','a big-box retailer','a rival company','a large corporation','a local competitor','a nonprofit','a consulting firm'];
const IND={
  coffee:{name:'Coffee roastery',product:'cold brew and fresh beans',unit:'cup',units:'cups',price:6,cost:2,perCust:8,market:60000,cpl:5,churn:.045,t:{sales:'Sales reps',ops:'Baristas',product:'Roasters',support:'Hosts'},one:{sales:'Sales rep',ops:'Barista',product:'Roaster',support:'Host'},blurb:'Cheap, habitual, high volume.'},
  sneakers:{name:'Sneaker brand',product:'limited-run sneakers',unit:'pair',units:'pairs',price:120,cost:45,perCust:.4,market:80000,cpl:9,churn:.05,t:{sales:'Sales reps',ops:'Factory crew',product:'Designers',support:'Care team'},one:{sales:'Sales rep',ops:'Factory worker',product:'Designer',support:'Care agent'},blurb:'Hype-driven, fashion margins.'},
  saas:{name:'Software app',product:'a team productivity app',unit:'seat',units:'seats',price:29,cost:4,perCust:1,market:120000,cpl:12,churn:.025,t:{sales:'Account execs',ops:'DevOps',product:'Engineers',support:'Success reps'},one:{sales:'Account exec',ops:'DevOps engineer',product:'Software engineer',support:'Success rep'},blurb:'Subscriptions, sticky customers.'},

  ebikes:{name:'E-bike maker',product:'electric commuter bikes',unit:'bike',units:'bikes',price:1800,cost:1000,perCust:.03,market:100000,cpl:15,churn:.035,t:{sales:'Showroom reps',ops:'Assemblers',product:'Engineers',support:'Mechanics'},one:{sales:'Showroom rep',ops:'Assembler',product:'Engineer',support:'Mechanic'},blurb:'Big tickets, thin volume.'},
  toys:{name:'Toy company',product:'build-it-yourself robot kits',unit:'kit',units:'kits',price:25,cost:9,perCust:1.5,market:70000,cpl:6,churn:.05,t:{sales:'Retail reps',ops:'Packers',product:'Toy designers',support:'Parent helpline'},one:{sales:'Retail rep',ops:'Packer',product:'Toy designer',support:'Helpline agent'},blurb:'Holiday rush every December.'},
  oil:{name:'Oil company',product:'gasoline and diesel from your own wells',unit:'gallon',units:'gallons',price:3.6,cost:1.5,perCust:14,market:150000,cpl:6,churn:.04,t:{sales:'Fuel traders',ops:'Rig crew',product:'Geologists',support:'Station attendants'},one:{sales:'Fuel trader',ops:'Rig worker',product:'Geologist',support:'Station attendant'},blurb:'Huge market, supply shocks, spill risk.'},
  restaurant:{name:'Restaurant group',product:'sit-down dinners at your bistros',unit:'meal',units:'meals',price:28,cost:9,perCust:1.6,market:60000,cpl:5,churn:.05,t:{sales:'Catering sales',ops:'Kitchen crew',product:'Chefs',support:'Waitstaff'},one:{sales:'Catering rep',ops:'Line cook',product:'Chef',support:'Server'},blurb:'Critics, inspectors, busy holidays.'},
  clothing:{name:'Clothing store',product:'everyday clothes and jackets',unit:'item',units:'items',price:45,cost:16,perCust:1.1,market:90000,cpl:7,churn:.05,t:{sales:'Brand reps',ops:'Stockroom crew',product:'Designers',support:'Sales associates'},one:{sales:'Brand rep',ops:'Stockroom worker',product:'Designer',support:'Sales associate'},blurb:'Trends change every season.'}
};
const NAMES=['Northwind & Co.','Bright Harbor','Copperline','Tall Pines Ltd.','Bluebird Works','Kestrel House'];

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const randn=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
const person=()=>rnd(FIRST)+' '+rnd(LAST);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt$(n){const a=Math.abs(n),s=n<0?'−':'';if(a>=1e9)return s+'$'+(a/1e9).toFixed(2)+'B';if(a>=1e6)return s+'$'+(a/1e6).toFixed(a>=1e7?1:2)+'M';if(a>=1e4)return s+'$'+Math.round(a/1e3)+'k';if(a>=1e3)return s+'$'+(a/1e3).toFixed(1)+'k';return s+'$'+Math.round(a);}
const fmtN=n=>Math.round(n).toLocaleString('en-US');
const fmtK=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e4?Math.round(n/1e3)+'k':fmtN(n);
const fmtP=p=>p>=100?'$'+Math.round(p).toLocaleString('en-US'):'$'+p.toFixed(2);
const pct=n=>Math.round(n*100)+'%';
const monthLabel=m=>MON[((m%12)+12)%12]+' Y'+(Math.floor(m/12)+1);
const priceStep=s=>s.ind.price<20?.25:s.ind.price<300?1:10;
const roundPrice=(p,s)=>{const st=priceStep(s);return Math.max(st,Math.round(p/st)*st);};
const short=n=>{const p=n.split(' ');return p[0][0]+'. '+p.slice(1).join(' ');};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:3;

/* ---------- state ---------- */
let S=null, confirmNew=false, setupPick='coffee';
const KEY='corner-office-v1';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function migrate(s){
  if(!s)return null;
  if(s.v===1){
    const P=n=>typeof n==='string'?{n,sk:3}:n;
    for(const d of D){const x=s.depts[d];x.mgr=x.mgr.map(P);x.vp=x.vp?P(x.vp):null;x.sk=x.sk||3;}
    s.execs.coo=s.execs.coo?P(s.execs.coo):null;s.execs.cfo=s.execs.cfo?P(s.execs.cfo):null;
    if(!s.ind.one)s.ind.one=IND[s.ind.key]?IND[s.ind.key].one:{sales:'Sales rep',ops:'Operations associate',product:'Product specialist',support:'Support agent'};
    s.pay={...MKT};s.cands=[];s.cid=1;s.leaving=[];s.v=2;
    refreshCands(s,3);
  }
  if(s.v===2&&s.depts.sales.ch==null){const C=p=>{if(p&&p.ch==null)p.ch=3;};for(const d of D){const x=s.depts[d];x.ch=3;x.mgr.forEach(C);C(x.vp);}C(s.execs.coo);C(s.execs.cfo);s.cands.forEach(c=>{if(c.ch==null){c.ch=3;c.shownCh=3;c.bio='';}});}
  return s.v===2?s:null;
}
function load(){try{return migrate(JSON.parse(localStorage.getItem(KEY)||'null'));}catch(e){return null;}}

function makeInd(key,custom){
  if(key!=='custom') return {...IND[key],key};
  const p=Math.max(1,Number(custom.price)||20);
  return {key:'custom',name:'Company',product:custom.product||'our product',unit:'unit',units:'units',price:p,cost:+(p*.38).toFixed(2),perCust:48/p,market:70000,cpl:7,churn:.045,
    t:{sales:'Sales reps',ops:'Operations crew',product:'Product team',support:'Support team'},one:{sales:'Sales rep',ops:'Operations associate',product:'Product specialist',support:'Support agent'}};
}
function newGame(name,key,custom){
  const ind=makeInd(key,custom);
  const st={v:2,name:name||'Northwind & Co.',ind,month:0,cash:300000,debt:0,equity:1,price:ind.price,mkt:5000,rd:0,
    depts:{sales:{emp:1,sk:3,ch:3,mgr:[],vp:null},ops:{emp:2,sk:3,ch:3,mgr:[],vp:null},product:{emp:1,sk:3,ch:3,mgr:[],vp:null},support:{emp:1,sk:3,ch:3,mgr:[],vp:null}},
    execs:{coo:null,cfo:null},customers:0,quality:45,rep:50,morale:75,marketSize:ind.market,regions:1,
    mods:{leadBoost:1,costMult:1,costM:0,refMult:1,refM:0,prodPen:1},
    pay:{...MKT},cands:[],cid:1,leaving:[],
    hist:[],log:[],ms:{},ev:null,lastRaise:-99,neg:0,over:false,won:false,last:null};
  st.log.unshift({m:0,t:`${st.name} opens its doors selling ${ind.product}. You have $300k and a team of five.`,k:'info'});
  refreshCands(st,4);
  return st;
}
function log(t,k='info'){S.log.unshift({m:S.month,t,k});if(S.log.length>80)S.log.length=80;}

const empCount=s=>D.reduce((a,d)=>a+s.depts[d].emp,0);
const mgrCount=s=>D.reduce((a,d)=>a+s.depts[d].mgr.length,0);
const vpCount=s=>D.filter(d=>s.depts[d].vp).length;
const execCount=s=>(s.execs.coo?1:0)+(s.execs.cfo?1:0);
const headcount=s=>1+empCount(s)+mgrCount(s)+vpCount(s)+execCount(s);
function payroll(s){let p=0;for(const d of D){const x=s.depts[d];p+=x.emp*s.pay[d]+x.mgr.length*s.pay.mgr+(x.vp?s.pay.vp:0);}if(s.execs.coo)p+=s.pay.coo;if(s.execs.cfo)p+=s.pay.cfo;return p;}
const ratio=(s,k)=>s.pay[k]/MKT[k];
function payGroups(s){return [...D.map(d=>[d,s.depts[d].emp]),['mgr',mgrCount(s)],['vp',vpCount(s)],['coo',s.execs.coo?1:0],['cfo',s.execs.cfo?1:0]];}
function avgRatio(s){let n=0,t=0;for(const [k,c] of payGroups(s)){n+=c;t+=c*ratio(s,k);}return n?t/n:1;}

function deptStats(s){
  const o={};let U=0;
  for(const d of D){const x=s.depts[d];const managed=Math.min(x.emp,x.mgr.length*SPAN);o[d]={managed,un:x.emp-managed};U+=o[d].un;}
  const cover=Math.min(U,CEO_SPAN);const uf=U>0?(U-cover)/U:0;
  const mf=.7+.5*s.morale/100;
  const coo=s.execs.coo?1+.033*s.execs.coo.sk:1;
  for(const d of D){const x=s.depts[d],q=o[d];
    const mb=1+.04*avg(x.mgr.map(m=>m.sk));
    const vp=x.vp?1.05+.05*x.vp.sk:1;
    const effort=clamp(.85+.15*ratio(s,d),.9,1.05);
    q.eff=(q.managed*mb+q.un*(1-uf)+q.un*uf*.5)*vp*coo*mf*s.mods.prodPen*(.7+.1*x.sk)*effort;}
  o.U=U;o.uf=uf;o.lost=U-cover;return o;
}

const WOM={sales:2,support:1.5,ops:1,product:.5};
function womOf(s){let t=0;const mf=.7+.5*s.morale/100;for(const d of D){const x=s.depts[d];t+=x.emp*8*(x.ch||3)*WOM[d];for(const m of x.mgr)t+=20*(m.ch||3);if(x.vp)t+=50*(x.vp.ch||3);}for(const k of ['coo','cfo'])if(s.execs[k])t+=60*(s.execs[k].ch||3);return t*mf*(.6+s.rep/125);}
/* ---------- the month engine ---------- */
function simulate(s,preview){
  const ind=s.ind,st=deptStats(s),m=s.month,quitLog=[];
  const season=(SEASON[ind.key]||{})[m%12]||1;
  const ref=ind.price*s.mods.refMult;
  const capacity=st.ops.eff*SERVE*ind.perCust;
  const mktLeads=s.mkt/ind.cpl/(1+s.mkt/150000)*(.6+s.rep/125)*(s.depts.sales.vp?1.15:1);
  const repLeads=st.sales.eff*120;
  const womLeads=womOf(s);
  const leads=(mktLeads+repLeads+womLeads)*season*s.mods.leadBoost;
  const pf=clamp(Math.pow(ref/s.price,1.6),.05,3);
  const conv=clamp(.15*pf*(.4+s.quality/100)*(.5+s.rep/100),0,.8);
  const room=Math.max(0,1-s.customers/s.marketSize);
  const newC=Math.round(leads*conv*room);
  const base=s.customers+newC;
  const demand=base*ind.perCust;
  const sold=Math.min(demand,capacity);
  const fulfill=demand>0?sold/demand:1;
  const supCov=base>0?Math.min(1,st.support.eff*SUP/base):1;
  const churnRate=ind.churn+.06*(1-supCov)+.03*(1-s.quality/100)+.12*(1-fulfill)+.03*Math.max(0,s.price/ref-1);
  const churned=Math.round(s.customers*churnRate);
  s.customers=Math.max(0,base-churned);
  const cfo=s.execs.cfo;
  const revenue=sold*s.price;
  const cogs=sold*ind.cost*s.mods.costMult*(cfo?1-.013*cfo.sk:1);
  const pay=payroll(s);
  const rent=headcount(s)*RENT*(cfo?.85:1);
  const interest=s.debt*.012;
  const expenses=cogs+pay+rent+s.mkt+s.rd+interest;
  const profit=revenue-expenses;
  s.cash+=profit;
  const q0=s.quality;
  const gain=(st.product.eff*1.1+s.rd/4000)*(1-s.quality/110);
  s.quality=clamp(s.quality+gain-1.2,5,100);
  const target=.45*s.quality+25*supCov+30*fulfill;
  s.rep=clamp(s.rep+(target-s.rep)*.2,0,100);
  const emp=empCount(s),lostFrac=emp?st.lost/emp:0;
  const payMood=clamp((avgRatio(s)-1)*50,-25,12);
  const mt=78-45*lostFrac+(vpCount(s)?4:0)+(s.execs.coo?3:0)-(supCov<.6?8:0)-(fulfill<.7?6:0)-(s.cash<0?20:0)+payMood;
  s.morale=clamp(s.morale+(mt-s.morale)*.25,0,100);
  let quits=0;
  if(!preview){
    for(const d of D){const x=s.depts[d];let q=0;
      if(s.morale<35)q+=Math.floor(x.emp*.08);
      const r=ratio(s,d);if(r<.9)q+=Math.round(x.emp*(.9-r)*.4+Math.random()*.6);
      q=Math.min(q,x.emp);if(q){x.emp-=q;quits+=q;if(r<.9)quitLog.push(`${q} underpaid ${ind.t[d].toLowerCase()} quit.`);}}
    const leave=(k,p,label,take)=>{if(ratio(s,k)<.85&&Math.random()<p){take();quitLog.push(label);}};
    for(const d of D){const x=s.depts[d];
      for(const mg of [...x.mgr])leave('mgr',.1,`${mg.n}, a ${DN[d]} manager, quit over pay.`,()=>{x.mgr=x.mgr.filter(y=>y!==mg);});
      if(x.vp){const n=x.vp.n;leave('vp',.12,`${n}, VP of ${DN[d]}, quit over pay.`,()=>{x.vp=null;});}}
    for(const k of ['coo','cfo'])if(s.execs[k]){const n=s.execs[k].n;leave(k,.15,`${n} quit the ${k.toUpperCase()} seat over pay.`,()=>{s.execs[k]=null;});}
    s.leaving=(s.leaving||[]).filter(L=>{if(L.m>s.month)return true;const x=s.depts[L.d];
      if(L.role==='emp'&&x.emp>0){x.emp--;quitLog.push(`${L.n} (${ind.one[L.d].toLowerCase()}) left for another job.`);}
      else if(L.role==='mgr'&&x.mgr.some(y=>y.n===L.n)){x.mgr=x.mgr.filter(y=>y.n!==L.n);quitLog.push(`${L.n}, a ${DN[L.d]} manager, left for another job.`);}
      return false;});
  }
  s.mods.leadBoost=1;s.mods.prodPen=1;
  if(s.mods.costM>0&&--s.mods.costM===0)s.mods.costMult=1;
  if(s.mods.refM>0&&--s.mods.refM===0)s.mods.refMult=1;
  s.month++;
  return {revenue,cogs,payroll:pay,rent,mkt:s.mkt,rd:s.rd,interest,expenses,profit,newC,churned,leads,repLeads:repLeads*season,mktLeads:mktLeads*season,womLeads:womLeads*season,conv,capacity,demand,sold,fulfill,supCov,qDelta:s.quality-q0,quits,quitLog,ref};
}
function preview(){const c=JSON.parse(JSON.stringify(S));return simulate(c,true);}

const opValue=s=>Math.max(0,valuation(s)-s.cash+s.debt);
function valuation(s){
  const rev=s.last?s.last.revenue:0;const h=s.hist;const prev=h.length>3?h[h.length-4].rev:0;
  const g=prev>0&&rev>0?Math.pow(rev/prev,1/3)-1:0;
  const mult=1.5+clamp(g*40,0,8)+s.rep/40+s.quality/50;
  return Math.max(0,rev*12*mult+s.cash-s.debt);
}
const maxDebt=s=>150000+(s.last?s.last.revenue*12:0)*(s.execs.cfo?.5:.2);
const expandCost=s=>Math.round(60000*Math.pow(1.9,s.regions-1)/1000)*1000;
const raiseAmt=s=>Math.max(250000,Math.round(opValue(s)*.25*(s.execs.cfo?1.2:1)/10000)*10000);
const canRaise=s=>s.month-s.lastRaise>=6&&s.last&&s.last.revenue>0&&s.equity>.2;

/* ---------- candidates ---------- */
const TRAITS=[
  {id:'refs',label:'Glowing references',g:1,sk:.4},
  {id:'built',label:'Built a team from scratch',g:1,sk:.35,lv:['mgr','vp','coo','cfo']},
  {id:'vet',label:'Industry veteran',g:1,sk:.2,minExp:10},
  {id:'culture',label:'Lifts the people around them',g:1,sk:.1},
  {id:'fast',label:'Fast learner',g:1,sk:.5,maxExp:3},
  {id:'poached',label:'Comes from a rival',g:1,sk:.5},
  {id:'hopper',label:'Job hopper: 4 jobs in 3 years',g:-1,sk:0},
  {id:'vague',label:'Vague about last role',g:-1,sk:-.6},
  {id:'late',label:'Late to the interview',g:-1,sk:-.3},
  {id:'padded',label:'Résumé looks padded',g:-1,sk:-.4},
  {id:'toxic',label:'Clashed with a former boss',g:-1,sk:0},
  {id:'remote',label:'Wants to work remotely',g:0,sk:0},
  {id:'bilingual',label:'Speaks three languages',g:0,sk:.1,ch:.4},
  {id:'regulars',label:'Regulars follow them from job to job',g:1,sk:0,ch:1.2,lv:['emp','mgr']},
  {id:'social',label:'Big social media following',g:1,sk:0,ch:1},
  {id:'clients',label:'Brings a client list',g:1,sk:.1,ch:1.3,dd:['sales']},
  {id:'network',label:'Well connected in the industry',g:1,sk:.1,ch:.8,lv:['mgr','vp','coo','cfo']},
  {id:'shy',label:'Shy with customers',g:-1,sk:0,ch:-1},
  {id:'rude',label:'Complaints about rudeness at last job',g:-1,sk:-.1,ch:-1.3}
];
const TR=Object.fromEntries(TRAITS.map(t=>[t.id,t]));
const EXP={emp:[0,12],mgr:[3,16],vp:[8,22],coo:[12,28],cfo:[12,28]};
const payKey=c=>c.lv==='emp'?c.d:c.lv;
function roleName(s,c){return c.lv==='emp'?s.ind.one[c.d]:c.lv==='mgr'?`${DN[c.d]} manager`:c.lv==='vp'?`VP of ${DN[c.d]}`:c.lv==='coo'?'Chief operating officer':'Chief financial officer';}
function background(s,c){
  const p=rnd(PLACES);
  if(c.lv==='emp')return c.exp<1?'Recent graduate, first full-time job':`${s.ind.one[c.d]} at ${p}`;
  if(c.lv==='mgr')return `${rnd(['Team lead','Shift supervisor','Assistant manager','Department manager'])} at ${p}`;
  if(c.lv==='vp')return `${rnd(['Director','Senior director','Head'])} of ${DN[c.d].toLowerCase()} at ${p}`;
  if(c.lv==='coo')return `${rnd(['VP of operations','General manager','Chief of staff'])} at ${p}`;
  return `${rnd(['Finance director','Controller','VP of finance'])} at ${p}`;
}
const PULL=[[1.8,'Puts customers off'],[2.6,'Low customer pull'],[3.4,'Average customer pull'],[4.2,'Strong customer pull'],[9,'Customer magnet']];
const pullLabel=v=>PULL.find(p=>v<=p[0])[1];
const leadsOf=c=>Math.round(c.lv==='emp'?8*c.shownCh*WOM[c.d]+(c.d==='sales'?120*(.7+.1*c.shown):0):c.lv==='mgr'?20*c.shownCh:c.lv==='vp'?50*c.shownCh:60*c.shownCh);
function bio(c){
  const f=c.n.split(' ')[0];
  const a=c.exp<1?`${f} is fresh out of school and eager to prove themself.`:c.exp>=10?`${f} is a seasoned hand who has seen it all.`:c.exp>=4?`${f} has solid hands-on experience.`:`${f} is early in their career.`;
  const b=c.shown>=4?'Interviewers called them one of the sharpest candidates this year.':c.shown>=3?'Capable and steady in the interview.':'Struggled with the practical questions.';
  const p=c.shownCh>=4.3?'Customers ask for them by name, so expect them to pull in new business.':c.shownCh>=3.5?'Good with people and likely to bring in customers.':c.shownCh>=2.7?'Neither a draw nor a turn-off for customers.':"Keeps customers at arm's length and won't win many new ones.";
  const q=((c.lv==='emp'&&c.d==='product')||c.lv==='cfo')?' Mostly works behind the scenes, so customer pull matters less here.':'';
  return `${a} ${b} ${p}${q}`;
}
function genCand(s,lv,d){
  const [lo,hi]=EXP[lv];const exp=Math.round(lo+Math.random()*(hi-lo));
  const c={id:s.cid++,lv,d:d||null,n:person(),exp,born:s.month,tr:[]};
  let sk=1.4+2.6*(exp-lo)/(hi-lo)+randn()*.8;let ch=2.6+randn()*.8+({sales:.6,support:.4,ops:0,product:-.3}[d]||0)+Math.min(.4,exp*.03);
  const k=1+Math.floor(Math.random()*2.6);
  const pool=TRAITS.filter(t=>(!t.dd||t.dd.includes(d))&&(!t.lv||t.lv.includes(lv))&&(!t.minExp||exp>=t.minExp)&&(t.maxExp==null||exp<=t.maxExp));
  while(c.tr.length<k&&pool.length){const t=pool.splice(Math.floor(Math.random()*pool.length),1)[0];c.tr.push(t.id);sk+=t.sk;ch+=t.ch||0;if(t.ch)for(let i=pool.length-1;i>=0;i--)if(pool[i].ch&&Math.sign(pool[i].ch)!==Math.sign(t.ch)&&pool[i].id!=='bilingual')pool.splice(i,1);}
  c.sk=+clamp(sk,1,5).toFixed(2);c.ch=+clamp(ch,1,5).toFixed(2);c.shownCh=clamp(Math.round((c.ch+randn()*.35)*2)/2,1,5);
  const vpEye=(lv==='emp'||lv==='mgr')&&s.depts[d].vp;
  const noise=randn()*(vpEye?.25:.65)+(c.tr.includes('padded')?.9:0);
  c.shown=clamp(Math.round((c.sk+noise)*2)/2,1,5);c.vpEye=!!vpEye;
  c.ask=Math.round(MKT[payKey(c)]*(.8+.1*c.sk)*(c.tr.includes('poached')?1.25:1)*(.95+Math.random()*.1)/100)*100;
  const iv=(s.rep-50)/50+(s.morale-60)/60+Math.random()-.5;
  c.int=iv>.4?'keen':iv>-.3?'open':'lukewarm';
  c.bg=background(s,c);
  c.bio=bio(c);
  return c;
}
function roleBlock(s,lv,d){
  if(lv==='emp')return '';
  if(lv==='mgr'){const x=s.depts[d];return x.mgr.length>=(x.vp?80:3)?(x.vp?'80 managers max':'4th manager needs a VP'):'';}
  if(lv==='vp'){const x=s.depts[d];if(x.vp)return 'VP seat is filled';if(x.mgr.length<2)return 'Needs 2 managers first';if(vpCount(s)>=2&&!s.execs.coo)return '3rd VP needs a COO';return '';}
  if(s.execs[lv])return 'Seat is filled';
  if(lv==='coo'&&vpCount(s)<2)return 'Needs 2 VPs first';
  if(lv==='cfo'&&headcount(s)<12)return 'Needs 12+ people';
  return '';
}
function refreshCands(s,n){
  const opts=[];
  for(const d of D){opts.push(['emp',d,3]);if(s.depts[d].emp>=4)opts.push(['mgr',d,1]);if(!roleBlock(s,'vp',d))opts.push(['vp',d,.6]);}
  for(const k of ['coo','cfo'])if(!roleBlock(s,k))opts.push([k,null,.6]);
  for(let i=0;i<n&&s.cands.length<10;i++){let r=Math.random()*opts.reduce((a,o)=>a+o[2],0);for(const o of opts){r-=o[2];if(r<=0){s.cands.push(genCand(s,o[0],o[1]));break;}}}
}
function accChance(s,c,bonus){
  const r=s.pay[payKey(c)]/c.ask;
  return clamp(.55+2.5*(r-1)+(s.rep-50)/120+({keen:.2,open:0,lukewarm:-.2}[c.int])+(s.morale-60)/200+(bonus?.35:0),.03,.97);
}
const bonusAmt=c=>Math.max(1000,Math.round(c.ask*2/1000)*1000);
function verdict(s,c){
  const g=c.tr.filter(t=>TR[t].g>0),b=c.tr.filter(t=>TR[t].g<0);
  const face=c.d&&c.d!=='product';
  const v=c.shown-.7*b.length+.25*g.length+(face?(c.shownCh-3)*.3:0);
  const key=v>=4.1?'strong':v>=3.3?'solid':v>=2.5?'gamble':'pass';
  const why=[];
  why.push(c.shown>=4?'Impressive interview':c.shown<=2.5?'Weak interview':'Decent interview');
  if(c.exp>=10)why.push(`${c.exp} years of experience`);else if(c.exp<=1)why.push('little real experience');
  if(face&&c.shownCh>=4)why.push('draws customers');else if(face&&c.shownCh<=2)why.push('weak with customers');
  if(c.tr.includes('refs'))why.push('references back them up');
  if(c.tr.includes('hopper'))why.push('may not stay long');
  if(c.tr.includes('padded'))why.push('the score may be inflated');
  if(c.tr.includes('toxic'))why.push('could hurt team morale');
  if(c.tr.includes('culture'))why.push('good for morale');
  const r=s.pay[payKey(c)]/c.ask;
  if(r<.95)why.push(`wants ${pct(1/r-1)} more than you pay`);else if(r>1.1)why.push('your pay beats their ask');
  if(c.vpEye)why.push('your VP sat in');
  let t=why.slice(0,4).join(', ');t=t[0].toUpperCase()+t.slice(1)+'.';
  return {key,label:{strong:'Strong hire',solid:'Solid hire',gamble:'Gamble',pass:'Pass'}[key],why:t};
}
function hireCand(s,c){
  const x=c.d?s.depts[c.d]:null;
  if(c.lv==='emp'){x.sk=(x.sk*x.emp+c.sk)/(x.emp+1);x.ch=(x.ch*x.emp+c.ch)/(x.emp+1);x.emp++;}
  else if(c.lv==='mgr')x.mgr.push({n:c.n,sk:c.sk,ch:c.ch});
  else if(c.lv==='vp')x.vp={n:c.n,sk:c.sk,ch:c.ch};
  else s.execs[c.lv]={n:c.n,sk:c.sk,ch:c.ch};
  if(c.tr.includes('culture'))s.morale=clamp(s.morale+3,0,100);
  if(c.tr.includes('toxic'))s.morale=clamp(s.morale-3,0,100);
  if(c.tr.includes('hopper')&&(c.lv==='emp'||c.lv==='mgr')&&Math.random()<.6)s.leaving.push({d:c.d,role:c.lv,n:c.n,m:s.month+3+Math.floor(Math.random()*5)});
}

function agencyHire(d,n){
  const x=S.depts[d],r=ratio(S,d),fee=S.pay[d]*.5;
  const p=clamp(.4+(r-.85)*4,0,1);let got=0;
  for(let i=0;i<n;i++){if(S.cash<fee)break;if(Math.random()<p){const sk=clamp(2.6+randn()*.5,1,4.2),ch=clamp(2.7+randn()*.5,1,4.2);x.sk=(x.sk*x.emp+sk)/(x.emp+1);x.ch=(x.ch*x.emp+ch)/(x.emp+1);x.emp++;S.cash-=fee;got++;}}
  if(got<n)log(`Agency sent ${n} ${S.ind.t[d].toLowerCase()}; ${got} accepted your ${fmt$(S.pay[d])}/mo.`,got?'info':'bad');
}
function act(a){
  const [cmd,p1,p2,p3]=a.split(':');
  if(cmd==='start'){startGame();return;}
  if(cmd==='new'){confirmNew=true;render();return;}
  if(cmd==='new-no'){confirmNew=false;render();return;}
  if(cmd==='new-yes'){confirmNew=false;S=null;try{localStorage.removeItem(KEY);}catch(e){}render();window.scrollTo(0,0);return;}
  if(!S)return;
  if(cmd==='run'){runMonth();return;}
  if(cmd==='tut'){Tut.start();return;}
  if(cmd==='floor'){floorOpen=!floorOpen;try{localStorage.setItem('co-floor',floorOpen?'1':'0');}catch(e){}render();return;}
  if(cmd==='ev'){const e=EVENTS[S.ev.id];const v=e.view(S,S.ev.d);const o=v.opts[+p1];o.run(S);log(`${v.title}: ${o.label.toLowerCase()}.`,'info');S.ev=null;}
  else if(cmd==='hire'&&p2==='emp'){if(S.over)return;agencyHire(p1,+p3||1);}
  else if(cmd==='promote'){const x=S.depts[p1];
    if(p2==='mgr'){if(!x.emp||roleBlock(S,'mgr',p1))return;const n=person();x.emp--;x.mgr.push({n,sk:+clamp(x.sk+randn()*.6,1,5).toFixed(2),ch:+clamp(x.ch+randn()*.6,1,5).toFixed(2)});log(`${n} is promoted to ${DN[p1]} manager.`);}
    else if(p2==='vp'){if(roleBlock(S,'vp',p1))return;const best=[...x.mgr].sort((a,b)=>b.sk-a.sk)[0];x.mgr=x.mgr.filter(m=>m!==best);x.vp={n:best.n,sk:+Math.min(5,best.sk+.2).toFixed(2),ch:best.ch||3};log(`${best.n} is promoted to VP of ${DN[p1]}.`,'good');}}
  else if(cmd==='fire'){const x=S.depts[p1];
    if(p2==='emp'){const k=Math.min(+p3||1,x.emp);if(!k)return;x.emp-=k;S.cash-=S.pay[p1]*k;S.morale=clamp(S.morale-Math.min(15,3*k),0,100);}
    else if(p2==='mgr'){if(!x.mgr.length)return;const m=[...x.mgr].sort((a,b)=>a.sk-b.sk)[0];x.mgr=x.mgr.filter(y=>y!==m);S.cash-=S.pay.mgr;S.morale=clamp(S.morale-4,0,100);log(`${m.n} (weakest ${DN[p1]} manager) is let go.`,'bad');}
    else if(p2==='vp'){if(!x.vp)return;log(`${x.vp.n} is let go as VP of ${DN[p1]}.`,'bad');x.vp=null;S.cash-=S.pay.vp;S.morale=clamp(S.morale-6,0,100);}}
  else if(cmd==='exec-fire'){if(!S.execs[p1])return;log(`${S.execs[p1].n} leaves the ${p1.toUpperCase()} seat.`,'bad');S.execs[p1]=null;S.cash-=S.pay[p1];S.morale=clamp(S.morale-6,0,100);}
  else if(cmd==='post'){const lv=p1,d=p2||null;if(roleBlock(S,lv,d)||S.cash<POST_FEE(lv))return;S.cash-=POST_FEE(lv);S.cands=S.cands.slice(-8);S.cands.push(genCand(S,lv,d),genCand(S,lv,d));log(`Job posted: ${roleName(S,{lv,d})}. Two people applied.`);}
  else if(cmd==='offer'){const c=S.cands.find(x=>x.id===+p1);if(!c||roleBlock(S,c.lv,c.d))return;const b=p2==='1',bn=b?bonusAmt(c):0;if(S.cash<bn)return;
    S.cands=S.cands.filter(x=>x!==c);
    if(Math.random()<accChance(S,c,b)){S.cash-=bn;hireCand(S,c);log(`${c.n} accepted: ${roleName(S,c)} at ${fmt$(S.pay[payKey(c)])}/mo${b?` with a ${fmt$(bn)} signing bonus`:''}.`,'good');}
    else log(`${c.n} turned down your offer for ${roleName(S,c)} and went elsewhere.`,'bad');}
  else if(cmd==='pass'){S.cands=S.cands.filter(x=>x.id!==+p1);}
  else if(cmd==='paymkt'){S.pay={...MKT};}
  else if(cmd==='bonus'){const c=headcount(S)*600;if(S.cash<c)return;S.cash-=c;S.morale=clamp(S.morale+12,0,100);log(`Team bonus paid: ${fmt$(c)}. Morale up.`,'good');}
  else if(cmd==='borrow'){const room=maxDebt(S)-S.debt;const amt=Math.min(50000,Math.floor(room/1000)*1000);if(amt<=0)return;S.debt+=amt;S.cash+=amt;log(`Borrowed ${fmt$(amt)} from the bank.`);}
  else if(cmd==='repay'){const amt=Math.min(50000,S.debt);if(amt<=0||S.cash<amt)return;S.debt-=amt;S.cash-=amt;log(`Repaid ${fmt$(amt)} of debt.`,'good');}
  else if(cmd==='raise'){if(!canRaise(S))return;const amt=raiseAmt(S);S.cash+=amt;S.equity*=.8;S.lastRaise=S.month;log(`Closed a funding round: ${fmt$(amt)} for 20% of the company.`,'good');}
  else if(cmd==='expand'){if(S.regions>=REGIONS.length)return;const c=expandCost(S);if(S.cash<c)return;S.cash-=c;S.marketSize+=Math.round(S.ind.market*(.8+.5*S.regions));S.regions++;log(`Expanded: now selling ${REGIONS[S.regions-1].toLowerCase()}. Market grows to ${fmtN(S.marketSize)} people.`,'good');}
  else if(cmd==='ipo'){S.won=true;log(`${S.name} rings the opening bell. You are a public company.`,'good');}
  else if(cmd==='continue'){S.over=false;S.neg=0;}
  checkMilestones();save();render();
}
function runMonth(){
  if(S.ev||S.over)return;
  const r=simulate(S,false);S.last=r;
  S.hist.push({m:S.month-1,rev:r.revenue,exp:r.expenses,profit:r.profit,cash:S.cash,cust:S.customers});
  if(S.hist.length>120)S.hist.shift();
  log(`Revenue ${fmt$(r.revenue)}, ${r.profit>=0?'profit':'loss'} ${fmt$(Math.abs(r.profit))}. +${fmtN(r.newC)} / −${fmtN(r.churned)} customers.`,r.profit>=0?'good':'bad');
  for(const q of r.quitLog)log(q,'bad');
  if(S.morale<35&&r.quits)log('Morale is low enough that people are walking out.','bad');
  if(S.cash<0){S.neg++;if(S.neg>=2){S.over=true;log('Two months underwater. The bank closed your accounts.','bad');}else log('Cash is negative. Fix it this month or the company folds.','bad');}else S.neg=0;
  S.cands=S.cands.filter(c=>S.month-c.born<3);
  refreshCands(S,1+Math.floor(Math.random()*2)+(S.rep>70?1:0));
  checkMilestones();
  if(!S.over)maybeEvent();
  save();render();
}

  function moveAgent(a,dt){
    if(!a.path.length){a.walk=0;return true;}
    const p=a.path[0],dx=p.x-a.x,dy=p.y-a.y,d=Math.hypot(dx,dy),v=a.sp*(a.kind!=='cust'&&info.morale<45?.75:1)*dt;
    if(d>.5)a.ang=Math.atan2(dy,dx);
    if(d<=v){a.x=p.x;a.y=p.y;a.path.shift();}else{a.x+=dx/d*v;a.y+=dy/d*v;}
    a.walk+=dt*12;return !a.path.length;
  }
  function step(dt){
    now+=dt;
    const rate=info.util*spots.length/(cfg.dwell+cfg.cook+4);
    acc+=rate*dt;while(acc>=1){acc--;spawn();}
    // queue
    if(queue.length){const free=spots.filter(s=>!s.occ);if(free.length){const c=queue.shift();seatPath(c,pick(free));placeQueue();}}
    for(const c of [...queue])if(now>c.pat){queue.splice(queue.indexOf(c),1);c.state='out';lost++;say(c,'!',1.8,C.bad);c.path=[{x:c.x<DX?-30:W+30,y:c.y}];placeQueue();}
    // customers
    for(const c of cust){
      const arrived=moveAgent(c,dt);
      if(c.state==='in'&&arrived){c.state='wait';orders.push({c,st:'cook',ready:now+cfg.cook/clamp(info.fulfill,.35,1)*rand(.8,1.3),stn:pick(stations)});
        const s=staff.filter(a=>a.kind==='sales');if(s.length&&now>welcomeT){say(pick(s),cfg.cars?'Fill it up?':'Welcome!',1.4);welcomeT=now+2.5;}}
      else if(c.state==='eat'&&now>c.until)leave(c,true);
    }
    cust=cust.filter(c=>!(c.state==='out'&&!c.path.length));
    // kitchen
    for(const st of stations)st.busy=Math.max(0,st.busy-dt);
    for(const o of orders){if(o.st==='cook'){if(o.stn)o.stn.busy=.6;if(now>=o.ready){const used=new Set(orders.filter(x=>x.slot!=null).map(x=>x.slot));for(let i=0;i<8;i++)if(!used.has(i)){o.slot=i;o.st='ready';break;}}}}
    const R=runners();
    for(const o of orders)if(o.st==='ready'){const r=R.find(a=>a.state==='idle');if(!r)break;
      r.state='toPass';r.order=o;o.st='taken';r.path=[{x:PX+28,y:PASSY+12+o.slot*22}];}
    for(const a of staff){
      const arrived=moveAgent(a,dt);
      if(a.kind==='ops'||a.kind==='support'){
        if(a.state==='toPass'&&arrived){a.carry=cfg.item!=='fuel';a.order.st='carried';a.order.slot=null;const c=a.order.c,sp=c.spot;
          const side=sp?(sp.x<sp.f.x?-14:sp.x>sp.f.x?14:0):0;a.state='toCust';a.path=[{x:(sp?sp.x:c.x)+side,y:(sp?sp.y:c.y)+(side?0:(sp&&sp.y<sp.f.y?-14:14))}];}
        else if(a.state==='toCust'&&arrived){if(cfg.item==='fuel'&&!a.fuelT){a.fuelT=now+1.6;}
          if(!a.fuelT||now>a.fuelT){a.fuelT=0;const c=a.order.c;if(c.state==='wait'){c.state='eat';c.until=now+cfg.dwell*rand(.8,1.25);c.item=true;}
            orders=orders.filter(o=>o!==a.order);a.order=null;a.carry=false;a.state='back';a.path=[{x:a.home.x,y:a.home.y}];}}
        else if(a.state==='back'&&arrived)a.state='idle';
        else if(a.kind==='ops'&&a.state==='idle'&&cfg.prod==='pumpjack'&&now>a.next){a.next=now+rand(5,9);a.state='stroll';a.path=[{x:a.home.x+rand(-40,30),y:a.home.y+rand(-20,20)},{x:a.home.x,y:a.home.y}];}
        else if(a.state==='stroll'&&arrived)a.state='idle';
      }else if(a.kind==='sales'){
        if(a.state==='idle'&&now>a.next){a.next=now+rand(9,16);a.state='flyer';a.path=[{x:DX,y:364},{x:DX+rand(-60,90),y:404}];}
        else if(a.state==='flyer'&&arrived){say(a,`Try ${info.ind.key==='oil'?'our fuel':'us'}!`,1.6);a.state='flyback';a.path=[{x:DX,y:364},{x:a.home.x,y:a.home.y}];}
        else if(a.state==='flyback'&&arrived)a.state='idle';
      }else if(a.kind==='product'){
        if(now>a.next){a.next=now+rand(8,15);if(Math.random()<.5)say(a,cfg.idea,2.2);}
      }else if(a.kind==='mgr'){
        if(a.state==='idle'&&now>a.next){const t=pick(staff.filter(s=>s.kind!=='mgr'&&s.kind!=='exec'))||{x:rand(380,960),y:rand(140,350)};a.target=t;a.state='go';a.path=[{x:t.x+16,y:t.y+2}];}
        else if(a.state==='go'&&arrived){a.state='idle';a.next=now+rand(1.8,3.2);if(Math.random()<.35)say(a,info.morale>=60?pick(['Nice work','Great job','Keep it up']):pick(['Pick it up','We are behind']),1.6);}
      }else if(a.kind==='exec'){
        if(a.state==='idle'&&now>a.next&&a.title!=='CEO'){a.next=now+rand(14,26);a.state='tour';a.path=[{x:a.x,y:92},{x:930,y:106},{x:rand(400,950),y:rand(150,340)}];}

        else if(a.state==='tourback'&&arrived){a.state='idle';a.next=now+rand(14,26);}

    // people sorted by depth
    const all=[...cust,...staff].sort((a,b)=>a.y-b.y);
    const hair=['#2b1d14','#5a3b22','#c69c5d','#1f1f1f','#8a5a35'];
    for(const a of all){
      if(a.kind==='cust'){if(cfg.cars)car(a);else drawP(a,a.clo,{hair:hair[Math.floor(a.bob*10)%5],carry:a.item&&['shelf','showbike','clothes'].includes(cfg.seat),busy:a.state==='eat'&&cfg.seat!=='shelf'});}
      else if(a.kind==='ops')drawP(a,UNI.ops,{hat:cfg.hat,apron:cfg.hat==='chef',carry:a.carry,busy:a.stn&&a.stn.busy>0&&!a.path.length});
      else if(a.kind==='support')drawP(a,UNI.support,{apron:cfg.hat==='chef',carry:a.carry,hair:'#3b2a1e'});
      else if(a.kind==='sales')drawP(a,UNI.sales,{hair:'#2b1d14'});
      else if(a.kind==='product')drawP(a,UNI.product,{hair:'#5a3b22',busy:true});
      else if(a.kind==='mgr')drawP(a,C.ink,{clip:true,hair:'#1f1f1f'});
      else drawP(a,C.ink,{tie:a.tie,hair:'#3b2a1e'});
    }
    for(const a of all)bubble(a);
    for(const f of fx){const k=(now-f.t0)/1.3;ctx.globalAlpha=Math.max(0,1-k);
      if(f.steam){ctx.fillStyle=C.muted;circ(f.x+Math.sin(k*8)*2,f.y-k*18,2+k*3);ctx.fill();}
      else{ctx.font='600 11px "IBM Plex Mono", monospace';ctx.fillStyle=f.col;ctx.textAlign='center';ctx.fillText(f.txt,f.x,f.y-k*22);}}
    ctx.globalAlpha=1;
    // hover
    if(hover){let best=null,bd=16;for(const a of all){const d=Math.hypot(a.x-hover.x,a.y-4-hover.y);if(d<bd){bd=d;best=a;}}
      if(best){const txt=best.kind==='cust'?(best.state==='queue'?'Customer · waiting outside':best.state==='wait'?'Customer · waiting for their order':best.state==='eat'?(cfg.cars?'Customer · filling up':cfg.seat==='table4'||cfg.seat==='table2'||cfg.seat==='picnic'?'Customer · eating':'Customer · shopping'):'Customer'):`${best.name} · ${best.title}`;
        ctx.font='500 11px "IBM Plex Sans", system-ui, sans-serif';const w=ctx.measureText(txt).width+14;let x=clamp(best.x-w/2,4,W-w-4),y=best.y-50;if(y<4)y=best.y+18;
        ctx.fillStyle=C.ink;rr(x,y,w,18,6);ctx.fill();ctx.fillStyle=C.paper;ctx.textAlign='left';ctx.fillText(txt,x+7,y+12.5);}}
    ctx.restore();
    cv.setAttribute('aria-label',`Live view of ${cfg.zp.toLowerCase()} and ${cfg.zs.toLowerCase()}: ${spots.filter(s=>s.occ).length} customers inside, ${queue.length} waiting outside.`);
  }
  return {mount,update,stop};
})();
const FLOOR_ON=['restaurant','sneakers','toys','clothing'];
const hasFloor=()=>FLOOR_ON.includes(S.ind.key);
function floorView(){
  if(!hasFloor())return '';
  const c=SCN[S.ind.key]||SCN.custom,t=S.ind.t;
  const lg=[[`background:#E0782F`,t.ops],[`background:#1FA187`,t.support],[`background:#D9487E`,t.sales],[`background:#8B5BD6`,t.product],[`background:var(--ink)`,'Managers, VPs and you']];
  return `<section class="panel floor-panel"><header><div class="fh"><span class="lbl">Live view</span><h2>${esc(c.zp)} and ${esc(c.zs.toLowerCase())}</h2></div><span class="fctl"><span class="hint" id="floor-cap"></span><button class="btn sm" data-act="floor">${floorOpen?'Hide':'Show live view'}</button></span></header>
  ${floorOpen?`<div id="floor-slot"></div><div class="legend">${lg.map(([s,l])=>`<span><i class="dot" style="${s}"></i>${esc(l)}</span>`).join('')}<span>Hover anyone to see who they are</span></div>`:''}</section>`;
}

/* ---------- tutorial ---------- */
const Tut=(()=>{
  let i=-1,steps=[],hl=null,card=null;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const seen=()=>{try{return localStorage.getItem('co-tut')==='1';}catch(e){return false;}};
  function list(){
    const t=S.ind.t,o=S.ind.one;
    return [
      {t:'Welcome, boss',b:`You just opened ${S.name}, a ${S.ind.name.toLowerCase()}. Your goal: hire people, win customers and grow until the company is worth $100 million. Each turn is one month. This tour shows you what to press.`},
      {s:'.top .wrap',t:'Your scoreboard',b:'Cash is the money in the bank. Valuation is what the company is worth. If cash stays below zero for two months in a row, the company closes.'},
      {s:'#p-levers',t:'Set your levers',b:'Drag the sliders to set your price, marketing and research. Marketing brings in customers; around $10k a month is a good start. The grey box shows what will happen this month before you play it.'},
      {s:'#p-org',t:'Your org chart',b:'You are the CEO at the top. Below you are four departments. Each dot is one person. A hollow orange dot means nobody manages that person, so they work at half speed.'},
      {s:'.depts .dept:nth-of-type(2)',t:`Hire ${t.ops.toLowerCase()}`,b:`Press + to hire one ${o.ops.toLowerCase()}, or +5 for five. Each one keeps about 450 customers supplied. Press + next to Managers to promote someone to manager. One manager runs 6 people.`},
      {s:'#p-boss',t:'Your to-do list',b:'Your chief of staff tells you the biggest problem each month. Fix the top item. If it says to hire more people, hire them. If it says runway is short, borrow or raise money.'},
      {s:'#p-hire',t:'Hiring desk',b:'New people apply every month. Green tags are good, red tags are warnings. Blue stars show how many customers they bring in. Press Offer to hire someone. They can say no.'},
      {s:'#p-pay',t:'Pay your people',b:'Drag a slider to set what each job earns. Keep it at market or higher. Below 90% of market, people quit and candidates turn you down.'},
      {s:'#p-cust',t:'Your customers',b:'See how many customers you have, how many you won and lost, and where they came from. Keep quality, reputation and morale high.'},
      {s:'.floor-panel',t:'Watch it live',b:'This is your business, live. Customers come in, get served and leave. Hover over anyone to see who they are. If you are short on staff, a line forms outside and people walk away.'},
      {s:'#p-fin',t:'Money tools',b:'Borrow from the bank, raise money from investors, press Expand to sell in a new region, or pay a team bonus to cheer everyone up.'},
      {t:'Decision memos',b:'Sometimes a yellow memo appears at the top with a choice, like a supplier raising prices or a rival poaching your VP. Pick an option before you can play the next month.'},
      {s:'.top .run',t:'Play your first month',b:'Press Run month to play a month. Then check your to-do list, fix the top problem, and run the next month. You can replay this tour with the Tutorial button.'}
    ].filter(s=>!s.s||document.querySelector(s.s));
  }
  function ensure(){
    if(hl)return;
    hl=document.createElement('div');hl.className='tut-hl';hl.hidden=true;
    card=document.createElement('div');card.className='tut-card';card.hidden=true;card.setAttribute('role','dialog');card.setAttribute('aria-label','Tutorial');
    document.body.append(hl,card);
    card.addEventListener('click',e=>{if(e.target.closest('.tut-next'))go(i+1);else if(e.target.closest('.tut-back'))go(i-1);else if(e.target.closest('.tut-skip'))end();});
    window.addEventListener('resize',place);window.addEventListener('scroll',place,{passive:true});
    document.addEventListener('keydown',e=>{if(i<0)return;if(e.key==='Escape')end();else if(e.key==='ArrowRight')go(i+1);else if(e.key==='ArrowLeft'&&i>0)go(i-1);});
  }
  function start(){if(!S)return;ensure();steps=list();hl.hidden=false;card.hidden=false;go(0);}
  function end(){i=-1;if(hl){hl.hidden=true;card.hidden=true;}try{localStorage.setItem('co-tut','1');}catch(e){}}
  function go(n){
    if(n<0)n=0;if(n>=steps.length){end();return;}i=n;const s=steps[i],last=i===steps.length-1;
    card.innerHTML=`<span class="lbl">Tutorial · ${i+1} of ${steps.length}</span><h3>${esc(s.t)}</h3><p>${esc(s.b)}</p>
      <div class="tut-btns"><button class="btn sm tut-skip">Skip tour</button><span class="tut-nav"><button class="btn sm tut-back" ${i?'':'disabled'}>Back</button><button class="btn sm memo tut-next">${last?'Start playing':'Next'}</button></span></div>`;
    const el=s.s&&document.querySelector(s.s);
    if(el&&!el.closest('.top')){const hdr=(document.querySelector('.top')||{offsetHeight:0}).offsetHeight,r=el.getBoundingClientRect();
      const y=r.height>innerHeight*.5?r.top+scrollY-hdr-16:r.top+scrollY-Math.max(hdr+16,(innerHeight-r.height)/2-60);
      window.scrollTo({top:Math.max(0,y),behavior:reduce?'auto':'smooth'});}
    place();card.querySelector('.tut-next').focus({preventScroll:true});
  }
  function place(){
    if(i<0||!card||card.hidden)return;
    if(!S){end();return;}
    const s=steps[i],el=s.s&&document.querySelector(s.s),vw=innerWidth,vh=innerHeight,cw=Math.min(380,vw-24);
    card.style.width=cw+'px';const ch=card.offsetHeight;
    if(!el){Object.assign(hl.style,{left:vw/2+'px',top:vh/2+'px',width:'0px',height:'0px'});card.style.left=(vw-cw)/2+'px';card.style.top=Math.max(12,(vh-ch)/2)+'px';return;}
    const r=el.getBoundingClientRect(),p=6;
    Object.assign(hl.style,{left:r.left-p+'px',top:r.top-p+'px',width:r.width+2*p+'px',height:r.height+2*p+'px'});
    let top=r.bottom+p+12+ch<vh-8?r.bottom+p+12:r.top-p-12-ch>8?r.top-p-12-ch:vh-ch-12;
    card.style.top=Math.max(8,top)+'px';card.style.left=clamp(r.left+r.width/2-cw/2,12,vw-cw-12)+'px';
  }
  return {start,end,refresh:place,seen};
})();

function render(){
  const app=document.getElementById('app');
  if(!S){Floor.stop();Tut.refresh();app.innerHTML=setupView();return;}
  const keepSel=(document.getElementById('post-role')||{}).value;
  const st=deptStats(S),pr=preview();
  app.innerHTML=tickBar()+`<main class="wrap">${memoView()}${wonView()}${floorView()}
    <div class="grid"><div class="col">${orgView(st,pr)}</div><div class="col">${leverView(pr)}${bossView(st,pr)}${customersView()}</div></div>
    <div class="hr"><div class="col">${hiringView()}</div><div class="col">${payView()}</div></div>
    <div class="lower"><div class="col">${chartView()}${financeView()}</div><div class="col">${msView()}${logView()}</div></div>
    ${howView()}</main>`;
  if(floorOpen&&hasFloor())Floor.mount(document.getElementById('floor-slot'));Floor.update(S,pr,floorOpen&&hasFloor());
  Tut.refresh();
  const sel=document.getElementById('post-role');if(sel&&keepSel){const o=sel.querySelector(`option[value="${keepSel}"]`);if(o&&!o.disabled)sel.value=keepSel;}
}

/* ---------- wiring ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  if(b.dataset.act==='post-sel'){const v=(document.getElementById('post-role')||{}).value;if(v)act('post:'+v);return;}
  act(b.dataset.act);});
document.addEventListener('change',e=>{
  if(e.target.name==='ind'){setupPick=e.target.value;const c=document.getElementById('custom-fields');if(c)c.hidden=setupPick!=='custom';}
  if(S&&(['lv-price','lv-mkt','lv-rd'].includes(e.target.id)||e.target.id.startsWith('pay-'))){save();render();}
});
document.addEventListener('input',e=>{
  if(!S)return;const id=e.target.id;
  if(id==='lv-price'){S.price=roundPrice(+e.target.value,S);document.getElementById('o-price').textContent=fmtP(S.price);document.getElementById('h-price').textContent=priceHint(S.ind.price*S.mods.refMult);}
  else if(id==='lv-mkt'){S.mkt=tToSpend(+e.target.value,300000);document.getElementById('o-mkt').textContent=fmt$(S.mkt)+'/mo';}
  else if(id==='lv-rd'){S.rd=tToSpend(+e.target.value,150000);document.getElementById('o-rd').textContent=fmt$(S.rd)+'/mo';}
  else if(id.startsWith('pay-')){const k=id.slice(4);S.pay[k]=+e.target.value;const c=(payGroups(S).find(g=>g[0]===k)||[0,0])[1];
    document.getElementById('o-pay-'+k).textContent=fmt$(S.pay[k]);document.getElementById('c-pay-'+k).textContent=fmt$(S.pay[k]*c)+'/mo total';}
  else return;
  document.getElementById('proj').innerHTML=projHTML(preview());
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!S&&e.target.id==='co-name'){e.preventDefault();startGame();}});

function start(data){S=migrate(data&&data.s)||load();render();if(S&&!Tut.seen())setTimeout(Tut.start,400);}
window.__co={get S(){return S;},act,runMonth,verdict:c=>verdict(S,c)};
if(window.claude?.hot&&typeof window.claude.hot.snapshot==='function')window.claude.hot.snapshot(()=>({s:S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
